<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#131829">
<title>고양이 체포 작전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D view; HUD hugs the safe edges; case-file paper cards for briefings. Single deliberate night look. */
:root {
  --night: #131829;
  --night-2: #1f2742;
  --paper: #efe8da;
  --paper-line: #d8ccb4;
  --ink: #1d2130;
  --ink-soft: #5b5f6e;
  --badge: #e9b949;
  --siren: #e0464b;
  --signal: #49c6ae;
  --hud-fg: #f3f0e8;
  --hud-dim: rgba(243, 240, 232, 0.62);
  --glass: rgba(19, 24, 41, 0.62);
  --f-display: "Black Han Sans", "Noto Sans KR", system-ui, sans-serif;
  --f-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--night); color: var(--hud-fg);
  font-family: var(--f-body); -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- HUD ---------- */
#hud {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.case-chip {
  display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 10px;
  background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  min-width: 0;
}
.case-chip .no { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; color: var(--badge); }
.case-chip .who { font-weight: 700; font-size: 15px; }
.top-right { display: flex; gap: 8px; align-items: center; }
.timer {
  font-family: var(--f-mono); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums;
  padding: 6px 12px; border-radius: 10px; background: var(--glass);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.timer.low { color: var(--siren); }
.icon-btn {
  pointer-events: auto; width: 40px; height: 40px; border-radius: 10px; border: 0;
  background: var(--glass); color: var(--hud-fg); display: grid; place-items: center;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer;
}
.icon-btn svg { width: 20px; height: 20px; }
button { touch-action: manipulation; }
.icon-btn:focus-visible, .tool:focus-visible, .act:focus-visible, .cta:focus-visible { outline: 3px solid var(--badge); outline-offset: 2px; }

#toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 84px); transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 999px;
  background: var(--paper); color: var(--ink); font-weight: 700; font-size: 15px; text-align: center;
  box-shadow: 0 6px 24px rgba(0,0,0,.35); transition: opacity .2s, transform .2s; pointer-events: none;
}
#toast.alert { background: var(--siren); color: #fff; }
#toast.good { background: var(--signal); color: #08231d; }
#toast[hidden] { display: none !important; }

/* reticle */
#reticle {
  position: fixed; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
  border-radius: 50%; border: 2px solid rgba(255,255,255,.75); pointer-events: none;
  box-shadow: 0 0 0 1px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.25);
  transition: transform .15s, border-color .15s;
}
#reticle::before, #reticle::after { content: ""; position: absolute; background: rgba(255,255,255,.8); }
#reticle::before { left: 50%; top: -9px; bottom: -9px; width: 2px; margin-left: -1px;
  -webkit-mask: linear-gradient(#000 0 9px, transparent 9px calc(100% - 9px), #000 0); mask: linear-gradient(#000 0 9px, transparent 9px calc(100% - 9px), #000 0); }
#reticle::after { top: 50%; left: -9px; right: -9px; height: 2px; margin-top: -1px;
  -webkit-mask: linear-gradient(90deg, #000 0 9px, transparent 9px calc(100% - 9px), #000 0); mask: linear-gradient(90deg, #000 0 9px, transparent 9px calc(100% - 9px), #000 0); }
#reticle.locked { border-color: var(--siren); transform: scale(.82); }
#reticle.locked::before, #reticle.locked::after { background: var(--siren); }
#reticle .tag {
  position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%);
  font-size: 12px; font-weight: 700; letter-spacing: .08em; white-space: nowrap;
  color: #fff; background: var(--siren); padding: 2px 8px; border-radius: 4px; display: none;
}
#reticle.locked .tag { display: block; }

/* sound direction ping */
#ping {
  position: fixed; width: 64px; height: 64px; margin: -32px 0 0 -32px; pointer-events: none;
  display: grid; place-items: center; opacity: 0; transition: opacity .25s;
}
#ping.on { opacity: 1; }
#ping .arrow { width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 18px solid var(--badge); filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
#ping .lbl { position: absolute; font-size: 12px; font-weight: 700; color: var(--badge); text-shadow: 0 1px 3px #000; transform: translateY(26px); white-space: nowrap; }

/* bottom tray */
.tray { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.tools { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; }
.tool {
  position: relative; width: 62px; height: 62px; border-radius: 14px; border: 2px solid transparent;
  background: var(--glass); color: var(--hud-fg); display: grid; place-items: center; cursor: pointer;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 0;
  font-family: var(--f-body);
}
.tool svg { width: 26px; height: 26px; margin-top: -8px; }
.tool .nm { position: absolute; bottom: 5px; left: 0; right: 0; font-size: 11px; font-weight: 500; color: var(--hud-dim); }
.tool .ct {
  position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 5px;
  background: var(--paper); color: var(--ink); font: 600 12px/22px var(--f-mono); font-variant-numeric: tabular-nums;
}
.tool[aria-pressed="true"] { border-color: var(--badge); background: rgba(233,185,73,.18); }
.tool[aria-pressed="true"] .nm { color: var(--badge); }
.tool.empty { opacity: .45; }
.act {
  pointer-events: auto; width: 86px; height: 86px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--siren); color: #fff; font-family: var(--f-display); font-size: 22px; letter-spacing: .02em;
  box-shadow: 0 0 0 5px rgba(224,70,75,.28), 0 8px 24px rgba(0,0,0,.4);
  transition: transform .08s;
}
.act:active { transform: scale(.94); }
.act:disabled { opacity: .5; }
.hint { text-align: center; font-size: 12px; color: var(--hud-dim); margin-bottom: 10px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }

/* grab hand */
#grab {
  position: fixed; left: 50%; bottom: -40vh; width: 46vmin; height: 46vmin; margin-left: -23vmin;
  pointer-events: none; color: #f0c9a4; filter: drop-shadow(0 10px 20px rgba(0,0,0,.45));
  transition: bottom .28s cubic-bezier(.2,.8,.3,1), transform .2s;
}
#grab.reach { bottom: calc(50% - 23vmin); }
#grab.close { transform: scale(.85) rotate(-8deg); }
#grab svg { width: 100%; height: 100%; }

/* ---------- overlays ---------- */
.overlay {
  position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto;
  background: rgba(13, 17, 31, .78); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.file {
  position: relative; width: min(420px, 100%); background: var(--paper); color: var(--ink);
  border-radius: 4px 14px 14px 14px; padding: 26px 22px 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  background-image: repeating-linear-gradient(transparent 0 31px, var(--paper-line) 31px 32px);
  background-position: 0 14px;
}
.file::before {
  content: "수사 기밀"; position: absolute; top: -14px; left: 0; padding: 4px 14px 6px; border-radius: 6px 6px 0 0;
  background: var(--paper); font: 700 11px/1 var(--f-body); letter-spacing: .14em; color: var(--siren);
}
.file .caseno { font-family: var(--f-mono); font-size: 12px; color: var(--ink-soft); letter-spacing: .04em; }
.file h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 10vw, 44px); line-height: 1.05; margin: 6px 0 16px; text-wrap: balance; }
.file h2 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 4px 0 12px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 16px; font-size: 15px; }
.facts dt { color: var(--ink-soft); font-size: 13px; padding-top: 1px; }
.facts dd { margin: 0; font-weight: 700; min-width: 0; }
.how { font-size: 14px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 18px; }
.how b { color: var(--ink); }
.cta {
  width: 100%; height: 56px; border: 0; border-radius: 12px; cursor: pointer;
  background: var(--ink); color: var(--paper); font-family: var(--f-display); font-size: 21px;
}
.cta.alt { background: transparent; color: var(--ink); border: 2px solid var(--ink); margin-top: 8px; font-size: 18px; height: 48px; }
.stamp {
  position: absolute; right: 18px; top: 26px; transform: rotate(-12deg);
  font-family: var(--f-display); font-size: 40px; padding: 2px 14px; border: 4px solid currentColor; border-radius: 8px;
  color: var(--siren); opacity: .9; animation: stamp .45s cubic-bezier(.2,1.6,.4,1) both;
}
.stamp.lost { color: var(--ink-soft); }
@keyframes stamp { from { transform: rotate(-12deg) scale(2.4); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: .9; } }
@media (prefers-reduced-motion: reduce) {
  .stamp { animation: none; }
  #grab, #toast, #reticle { transition: none; }
}
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 18px; }
.stats div { border-top: 2px solid var(--ink); padding-top: 6px; min-width: 0; }
.stats .k { font-size: 12px; color: var(--ink-soft); }
.stats .v { font-family: var(--f-mono); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
</style>

</head>
<body>
<canvas id="view" aria-label="거실 3D 화면"></canvas>

<div id="hud" hidden>
  <div class="topbar">
    <div class="case-chip"><span class="no" id="hudCase">사건 1/3</span><span class="who" id="hudWho">용의자 치즈</span></div>
    <div class="top-right">
      <div class="timer" id="hudTime" aria-live="off">2:00</div>

</div>

<div id="reticle" hidden><span class="tag">용의자</span></div>

</div>

<div class="overlay" id="scrTitle">
  <div class="file">
    <div class="caseno" id="tCaseNo">사건번호 2026-거실-001</div>
    <h1>고양이 체포 작전</h1>
    <dl class="facts">
      <dt>용의자</dt><dd id="tWho">치즈 · 코리안 숏헤어</dd>
      <dt>특징</dt><dd id="tTrait">겁이 많고 상자를 좋아함</dd>

    <button class="cta" id="btnStart">수사 시작</button>

</div>

<div class="overlay" id="scrResult" hidden>

    <div class="stamp" id="rStamp">검거</div>
    <div class="caseno" id="rCaseNo">사건번호 2026-거실-001</div>
    <h2 id="rTitle">사건 종결</h2>
    <div class="stats">
      <div><div class="k">소요 시간</div><div class="v" id="rTime">0:42</div></div>
      <div><div class="k">시도</div><div class="v" id="rTries">3회</div></div>
      <div><div class="k">남은 그물</div><div class="v" id="rNets">2</div></div>
    </div>
    <p class="how" id="rNote"></p>
    <button class="cta" id="btnNext">다음 사건</button>
    <button class="cta alt" id="btnRetry">이 사건 다시</button>
  </div>
</div>

const catMeshes = [];
function makeCat(stage) {
  const root = new THREE.Group();
  const stripeTex = stage.stripe ? canvasTex(256, 128, (g, w, h) => {
    g.fillStyle = '#' + stage.color.toString(16).padStart(6, '0'); g.fillRect(0, 0, w, h);
    g.fillStyle = '#' + stage.stripe.toString(16).padStart(6, '0');
    for (let i = 0; i < 16; i++) { const x = (i / 16) * w; g.beginPath(); g.moveTo(x, 0); for (let y = 0; y <= h * 0.62; y += 8) g.lineTo(x + Math.sin(y * 0.12 + i) * 4 + 5, y); for (let y = h * 0.62; y >= 0; y -= 8) g.lineTo(x + Math.sin(y * 0.12 + i) * 4 - 1, y); g.fill(); }
  }) : null;
  const fur = new THREE.MeshStandardMaterial({ color: stripeTex ? 0xffffff : stage.color, map: stripeTex, roughness: 0.95 });
  const furPlain = new THREE.MeshStandardMaterial({ color: stage.color, roughness: 0.95 });
  const lightC = new THREE.Color(stage.color).lerp(new THREE.Color(0xfff4e6), stage.stripe ? 0.55 : 0.08);
  const belly = new THREE.MeshStandardMaterial({ color: lightC, roughness: 0.95 });
  const pink = M(0xe79aa0, 0.6);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xd8f06a, emissive: 0xc8e34a, emissiveIntensity: stage.stripe ? 0.5 : 1.3, roughness: 0.2 });
  const add = (parent, geo, mat, pos, scale) => { const m = new THREE.Mesh(geo, mat); m.position.copy(pos); if (scale) m.scale.copy(scale); m.castShadow = true; m.userData.cat = true; parent.add(m); catMeshes.push(m); return m; };
  const sph = new THREE.SphereGeometry(1, 20, 14);

  const bodyG = new THREE.Group(); root.add(bodyG);
  const body = add(bodyG, sph, fur, new V3(0, 0, 0), new V3(0.15, 0.13, 0.26));
  add(bodyG, sph, belly, new V3(0, -0.03, 0.13), new V3(0.1, 0.09, 0.1));
  const headG = new THREE.Group(); root.add(headG);
  add(headG, sph, fur, new V3(0, 0, 0), new V3(0.105, 0.095, 0.1));
  add(headG, sph, belly, new V3(0, -0.03, 0.07), new V3(0.055, 0.04, 0.045));
  const earGeo = new THREE.ConeGeometry(0.042, 0.085, 4);
  for (const sx of [-1, 1]) {
    const e = add(headG, earGeo, furPlain, new V3(sx * 0.055, 0.085, -0.01)); e.rotation.set(-0.15, Math.PI / 4, sx * -0.28);
    const ei = add(headG, earGeo, pink, new V3(sx * 0.053, 0.08, 0.004), new V3(0.55, 0.65, 0.4)); ei.rotation.copy(e.rotation);
  }
  const eyes = [];
  for (const sx of [-1, 1]) {
    const eye = add(headG, sph, eyeMat, new V3(sx * 0.04, 0.015, 0.082), new V3(0.021, 0.021, 0.012));
    add(eye, sph, M(0x0a0a0a, 0.2), new V3(0, 0, 0.75), new V3(0.35, 0.85, 0.5));
    eyes.push(eye);
  }
  add(headG, sph, pink, new V3(0, -0.012, 0.1), new V3(0.012, 0.009, 0.008));
  const legs = [];
  const legGeo = new THREE.CylinderGeometry(0.028, 0.024, 0.17, 8); legGeo.translate(0, -0.085, 0);
  for (const [lx, lz] of [[-0.08, 0.15], [0.08, 0.15], [-0.08, -0.15], [0.08, -0.15]]) {
    const lg = new THREE.Group(); lg.position.set(lx, 0, lz); bodyG.add(lg);
    add(lg, legGeo, furPlain, new V3(0, 0, 0)); add(lg, sph, belly, new V3(0, -0.17, 0.012), new V3(0.03, 0.018, 0.04));
    legs.push(lg);
  }
  const tail = []; let parent = bodyG; const N = 8, SL = 0.055;
  for (let i = 0; i < N; i++) {
    const seg = new THREE.Group(); seg.position.set(0, i === 0 ? 0.05 : 0, i === 0 ? -0.24 : -SL); parent.add(seg);
    const r = 0.024 - i * 0.0013;
    const c = add(seg, new THREE.CylinderGeometry(r, r + 0.001, SL + 0.012, 8), (i > 5 && stage.stripe) ? new THREE.MeshStandardMaterial({ color: stage.stripe, roughness: 0.95 }) : furPlain, new V3(0, 0, -SL / 2));
    c.rotation.x = Math.PI / 2; tail.push(seg); parent = seg;
  }
  root.traverse((o) => { if (o.isMesh) o.userData.cat = true; });
  return { root, bodyG, headG, legs, tail, eyes };
}

/* =====================================================================
   5. 시점 조작 — 자이로(기울기 센서) 우선, 안 되면 화면 드래그
   ===================================================================== */
const look = { yaw: 0, pitch: -0.12, gyro: false, ori: null, yawOffset: 0, needCenter: true, zoom: 1 };
const qDev = new THREE.Quaternion(), qYaw = new THREE.Quaternion(), qTarget = new THREE.Quaternion();
const zee = new V3(0, 0, 1), qFix = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)), eul = new THREE.Euler(), q0 = new THREE.Quaternion();

function screenAngle() { return ((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) * Math.PI / 180; }
function oriToQuat(q, e) {
  const d2r = Math.PI / 180;
  eul.set((e.beta || 0) * d2r, (e.alpha || 0) * d2r, -(e.gamma || 0) * d2r, 'YXZ');
  q.setFromEuler(eul); q.multiply(qFix); q.multiply(q0.setFromAxisAngle(zee, -screenAngle()));
  return q;
}
window.addEventListener('deviceorientation', (e) => {

});
function yawOf(q) { const f = new V3(0, 0, -1).applyQuaternion(q); return Math.atan2(-f.x, -f.z); }
function updateCamera(dt) {

    oriToQuat(qDev, look.ori);
    if (look.needCenter) { look.yawOffset = 0 - yawOf(qDev); look.needCenter = false; camera.quaternion.copy(qTarget); }
    qYaw.setFromAxisAngle(Y_AXIS, look.yawOffset);
    qTarget.copy(qYaw).multiply(qDev);
    camera.quaternion.slerp(qTarget, Math.min(1, dt * 18));

    eul.set(look.pitch, look.yaw, 0, 'YXZ'); camera.quaternion.setFromEuler(eul);
  }
}
// 터치: 한 손가락 = 둘러보기, 두 손가락 = 확대
const pointers = new Map(); let pinch0 = 0, zoom0 = 1;

canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    const k = 0.0042 / look.zoom;

    else { look.yaw += dx * k; look.pitch = THREE.MathUtils.clamp(look.pitch + dy * k, -1.35, 1.2); }
  } else if (pointers.size === 2) {

  const ang = Math.atan2(y, x), m = 1 / Math.max(Math.abs(Math.cos(ang)), Math.abs(Math.sin(ang)));
  const ex = Math.cos(ang) * m * 0.86, ey = Math.sin(ang) * m * 0.78;
  el.style.left = ((ex + 1) / 2) * innerWidth + 'px'; el.style.top = ((1 - ey) / 2) * innerHeight + 'px';
  el.querySelector('.arrow').style.transform = `rotate(${90 - (ang * 180) / Math.PI}deg)`;
  el.classList.add('on');
}
function fmt(t) { t = Math.max(0, Math.ceil(t)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; }
function updateCounts() {
  $('#ctNet').textContent = G.nets; $('#ctTreat').textContent = G.treats;
  document.querySelector('[data-tool="net"]').classList.toggle('empty', G.nets <= 0);
  document.querySelector('[data-tool="treat"]').classList.toggle('empty', G.treats <= 0);
}
const ACT_LABEL = { hand: '잡기', net: '던지기', treat: '놓기' };
const HINT = { hand: '조준선에 용의자를 맞추고 잡기', net: '숨은 곳을 겨냥해서 그물 던지기', treat: '바닥을 보고 간식 놓기' };
function selectTool(t) {
  G.tool = t; document.querySelectorAll('.tool').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tool === t)));
  $('#btnAct').textContent = ACT_LABEL[t]; $('#hint').textContent = HINT[t];
}
document.querySelectorAll('.tool').forEach((b) => b.addEventListener('click', () => selectTool(b.dataset.tool)));
$('#btnAct').addEventListener('click', () => {
  if (G.phase !== 'play' || G.busy || C.state === 'caught') return;
  if (G.tool === 'hand') doGrab(); else if (G.tool === 'net') doNet(); else doTreat();
});
$('#btnCenter').addEventListener('click', () => { if (look.gyro) look.needCenter = true; else { look.yaw = 0; look.pitch = -0.12; } toast('정면을 다시 맞췄습니다'); });
$('#btnSound').addEventListener('click', (e) => {
  soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', String(soundOn)); e.currentTarget.setAttribute('aria-label', soundOn ? '소리 끄기' : '소리 켜기');
  $('#snd-wave').style.display = soundOn ? '' : 'none';
});
function caseNo(i) { return `사건번호 2026-거실-${String(i + 1).padStart(3, '0')}`; }
function fillTitle() {
  const S = stageCfg();
  $('#tCaseNo').textContent = caseNo(G.stage); $('#tWho').textContent = `${S.name} · ${S.breed}`;
  $('#tTrait').textContent = S.trait; $('#tTime').textContent = `${Math.floor(S.time / 60)}분 ${S.time % 60 ? (S.time % 60) + '초' : ''}`.trim();
}
async function enableMotion() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      return (await DeviceOrientationEvent.requestPermission()) === 'granted';
    }
  } catch { return false; }
  return true;
}
let motionAsked = false;
$('#btnStart').addEventListener('click', async () => {
  if (!AC) initAudio(); else AC.resume?.();
  if (!motionAsked) { motionAsked = true; await enableMotion(); }
  try { await navigator.wakeLock?.request('screen'); } catch {}
  $('#scrTitle').hidden = true; $('#hud').hidden = false; $('#reticle').hidden = false;
  setupStage();
  setTimeout(() => { if (!look.gyro && G.phase === 'play') toast('센서를 쓸 수 없어 화면을 밀어서 둘러봅니다'); }, 1400);
});
function endStage(win, method) {
  G.phase = 'result'; G.busy = false;
  const S = stageCfg(), last = G.stage === STAGES.length - 1;
  $('#rStamp').textContent = win ? '검거' : '도주'; $('#rStamp').className = 'stamp' + (win ? '' : ' lost');
  $('#rCaseNo').textContent = caseNo(G.stage);
  $('#rTitle').textContent = win ? `${S.name} 검거 완료` : `${S.name}이(가) 도주했습니다`;
  $('#rTime').textContent = fmt(G.elapsed); $('#rTries').textContent = `${G.tries}회`; $('#rNets').textContent = String(G.nets);
  $('#rNote').textContent = win
    ? (method === 'net' ? '그물로 확실하게 잡았습니다.' : '맨손으로 잡았습니다. 훌륭한 반사신경입니다.') + (last ? ' 모든 사건을 해결했습니다.' : ' 다음 용의자는 더 빠릅니다.')
    : '울음소리 방향을 따라가고, 간식으로 밖으로 끌어낸 뒤 그물을 던져 보세요.';
  $('#btnNext').hidden = !win; $('#btnNext').textContent = last ? '처음 사건부터' : '다음 사건';
  $('#btnRetry').textContent = win ? '이 사건 다시' : '다시 수사';
  $('#btnRetry').className = win ? 'cta alt' : 'cta';
  $('#scrResult').hidden = false; $('#reticle').hidden = true;
}
$('#btnNext').addEventListener('click', () => { G.stage = (G.stage + 1) % STAGES.length; $('#scrResult').hidden = true; $('#reticle').hidden = false; setupStage(); });
$('#btnRetry').addEventListener('click', () => { $('#scrResult').hidden = true; $('#reticle').hidden = false; setupStage(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) clock.getDelta(); });

/* =====================================================================
   10. 루프
   ===================================================================== */
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
let frame = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, clock.getDelta());
  updateCamera(dt);
  const baseFov = camera.aspect < 1 ? 86 : 64; const fov = baseFov / look.zoom;
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld();
  if (G.phase === 'play') {
    G.timeLeft -= dt; G.elapsed += dt;
    if (C.state !== 'caught') updateCat(dt); else animateCat(dt);
    if ((frame++ & 1) === 0) G.target = C.state === 'caught' ? null : scanTarget();
    $('#reticle').classList.toggle('locked', !!G.target);
    if (G.target && C.state === 'hide' && G.foundSpot !== C.spot) { G.foundSpot = C.spot; toast(`${C.spot.name}에서 용의자 발견!`, 'alert'); buzz(30); }
    const tEl = $('#hudTime'); tEl.textContent = fmt(G.timeLeft); tEl.classList.toggle('low', G.timeLeft < 20);
    if (G.timeLeft <= 0 && C.state !== 'caught') endStage(false);
    updateNet(dt); updateListener(); updatePing();
  } else if (G.phase === 'title') {
    look.yaw = Math.sin(performance.now() / 4000) * 0.9; look.pitch = -0.18;
  }
  renderer.render(scene, camera);
}
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
fillTitle();
loop();
window.__game = { G, C, SPOTS, look, camera, moveTo, placeAtSpot, scanTarget };
</script>
